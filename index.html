<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Website-Builder</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Website-Builder" />
<meta name="theme-color" content="#14171C" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14171C; color: #ECEEF2; font-family: 'Inter', sans-serif; overscroll-behavior: none; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  @media (min-width: 768px) { #app { flex-direction: row; } }

  #tabbar { display: flex; border-bottom: 1px solid #242A36; background: #171B22; }
  @media (min-width: 768px) { #tabbar { display: none; } }
  #tabbar button { flex: 1; background: none; border: none; color: #5C6270; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 0; border-bottom: 2px solid transparent; }
  #tabbar button.active { color: #ECEEF2; border-bottom-color: #5B8DEF; }

  #chat-pane { display: flex; flex-direction: column; background: #171B22; border-right: 1px solid #242A36; flex: 1; min-height: 0; }
  @media (min-width: 768px) { #chat-pane { width: 380px; flex: none; } }
  #chat-pane.hidden-mobile { display: none; }
  @media (min-width: 768px) { #chat-pane.hidden-mobile { display: flex; } }

  #header { padding: 16px 20px; border-bottom: 1px solid #242A36; display: flex; justify-content: space-between; align-items: flex-start; }
  #header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; margin: 4px 0 0; }
  .eyebrow { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #F2A65A; }
  .eyebrow span { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: #7C8394; }
  #reset-btn { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7C8394; background: none; border: none; cursor: pointer; }

  #messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; font-size: 13.5px; line-height: 1.5; }
  .msg.user { align-self: flex-end; background: #5B8DEF; color: #0E1116; }
  .msg.assistant { align-self: flex-start; background: #20242E; border: 1px solid #2A303C; color: #D9DCE3; }
  .msg.loading { align-self: flex-start; background: #20242E; border: 1px solid #2A303C; color: #7C8394; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }

  .suggestions { padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .suggestions p { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #5C6270; margin: 0 0 4px; }
  .suggestions button { text-align: left; background: #1B1F28; border: 1px solid #2A303C; color: #B7BBC4; border-radius: 8px; padding: 10px 12px; font-size: 13px; font-family: inherit; cursor: pointer; }

  #version-bar { display: none; padding: 0 20px 8px; align-items: center; gap: 8px; }
  #version-bar.show { display: flex; }
  #version-bar button { font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 8px; border-radius: 6px; border: 1px solid #2A303C; background: none; color: #B7BBC4; cursor: pointer; }
  #version-bar button:disabled { color: #3A4152; border-color: #242A36; }
  #version-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #5C6270; margin-left: auto; }

  #input-row { padding: 14px; border-top: 1px solid #242A36; }
  #input-box { display: flex; align-items: flex-end; gap: 8px; background: #20242E; border: 1px solid #2A303C; border-radius: 10px; padding: 8px 10px; }
  #input-box textarea { flex: 1; background: none; border: none; outline: none; resize: none; color: #ECEEF2; font-family: inherit; font-size: 13.5px; }
  #input-box textarea::placeholder { color: #5C6270; }
  #send-btn { width: 32px; height: 32px; border-radius: 8px; background: #5B8DEF; border: none; color: #0E1116; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  #send-btn:disabled { background: #2A303C; color: #5C6270; }

  #preview-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #preview-pane.hidden-mobile { display: none; }
  @media (min-width: 768px) { #preview-pane.hidden-mobile { display: flex; } }
  #preview-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #242A36; background: #171B22; }
  #preview-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #7C8394; margin-left: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #download-btn { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 12px; border-radius: 6px; border: 1px solid #2A303C; background: none; color: #D9DCE3; cursor: pointer; display: none; }
  #preview-frame-wrap { flex: 1; background: #fff; }
  #preview-frame-wrap iframe { width: 100%; height: 100%; border: 0; }
  #empty-state { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #14171C; background-image: linear-gradient(#2A3040 1px, transparent 1px), linear-gradient(90deg, #2A3040 1px, transparent 1px); background-size: 28px 28px; }
  #empty-state p { font-family: 'Space Grotesk', sans-serif; color: #3A4152; font-size: 14px; }

  #key-overlay { position: fixed; inset: 0; background: #14171Cee; display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50; }
  #key-box { background: #171B22; border: 1px solid #2A303C; border-radius: 12px; padding: 24px; max-width: 380px; width: 100%; }
  #key-box h2 { font-family: 'Space Grotesk', sans-serif; font-size: 16px; margin: 0 0 8px; }
  #key-box p { font-size: 13px; color: #9AA0AC; line-height: 1.5; margin: 0 0 14px; }
  #key-box input { width: 100%; background: #20242E; border: 1px solid #2A303C; border-radius: 8px; padding: 10px 12px; color: #ECEEF2; font-family: 'JetBrains Mono', monospace; font-size: 13px; margin-bottom: 12px; }
  #key-box button { width: 100%; background: #5B8DEF; color: #0E1116; border: none; border-radius: 8px; padding: 10px; font-weight: 600; cursor: pointer; }
  #key-box a { color: #5B8DEF; }
</style>
</head>
<body>

<div id="key-overlay">
  <div id="key-box">
    <h2>API-Key eintragen</h2>
    <p>Diese App braucht deinen eigenen Anthropic-API-Key, um Websites zu generieren. Erstelle einen kostenlos unter <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>. Der Key wird nur lokal in diesem Browser gespeichert.</p>
    <input id="key-input" type="password" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off" />
    <button id="key-save">Speichern & starten</button>
  </div>
</div>

<div id="app">
  <div id="tabbar">
    <button id="tab-chat" class="active">Chat</button>
    <button id="tab-preview">Vorschau</button>
  </div>

  <div id="chat-pane">
    <div id="header">
      <div>
        <div class="eyebrow"><div class="dot"></div><span>Website-Builder</span></div>
        <h1>Beschreib. Ich baue.</h1>
      </div>
      <button id="reset-btn" style="display:none;">↺ neu</button>
    </div>
    <div id="messages"></div>
    <div id="version-bar">
      <button id="undo-btn">← Zurück</button>
      <button id="redo-btn">Vor →</button>
      <span id="version-label"></span>
    </div>
    <div id="input-row">
      <div id="input-box">
        <textarea id="input" rows="2" placeholder="z. B. Portfolio-Seite für eine Fotografin, minimalistisch …"></textarea>
        <button id="send-btn">→</button>
      </div>
    </div>
  </div>

  <div id="preview-pane" class="hidden-mobile">
    <div id="preview-bar">
      <div style="display:flex; align-items:center;">
        <span id="preview-title">neue-website.html</span>
      </div>
      <button id="download-btn">↓ Download</button>
    </div>
    <div id="preview-frame-wrap">
      <div id="empty-state"><p>Deine Vorschau erscheint hier</p></div>
    </div>
  </div>
</div>

<script>
const SUGGESTIONS = [
  "Landingpage für ein Café, warm & einladend",
  "Portfolio für eine Fotografin, minimalistisch",
  "Startseite für eine Zahnarztpraxis, vertrauenswürdig",
  "Event-Seite für eine Hochzeit, romantisch",
];

let history = [];
let historyIndex = -1;
let loading = false;
let lastFailedPrompt = null;
let apiKey = localStorage.getItem('anthropic_api_key') || '';

const el = (id) => document.getElementById(id);
const messagesEl = el('messages');
const inputEl = el('input');
const sendBtn = el('send-btn');
const previewWrap = el('preview-frame-wrap');
const previewTitle = el('preview-title');
const downloadBtn = el('download-btn');
const resetBtn = el('reset-btn');
const versionBar = el('version-bar');
const undoBtn = el('undo-btn');
const redoBtn = el('redo-btn');
const versionLabel = el('version-label');
const keyOverlay = el('key-overlay');

if (apiKey) keyOverlay.style.display = 'none';

el('key-save').onclick = () => {
  const v = el('key-input').value.trim();
  if (!v) return;
  localStorage.setItem('anthropic_api_key', v);
  apiKey = v;
  keyOverlay.style.display = 'none';
};

el('tab-chat').onclick = () => setMobileView('chat');
el('tab-preview').onclick = () => setMobileView('preview');

function setMobileView(view) {
  el('chat-pane').classList.toggle('hidden-mobile', view !== 'chat');
  el('preview-pane').classList.toggle('hidden-mobile', view !== 'preview');
  el('tab-chat').classList.toggle('active', view === 'chat');
  el('tab-preview').classList.toggle('active', view === 'preview');
}

function addMessage(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  messagesEl.appendChild(d);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return d;
}

function renderSuggestions() {
  if (history.length > 0) return;
  const wrap = document.createElement('div');
  wrap.className = 'suggestions';
  wrap.id = 'suggestions-block';
  const p = document.createElement('p');
  p.textContent = 'Vorschläge';
  wrap.appendChild(p);
  SUGGESTIONS.forEach((s) => {
    const b = document.createElement('button');
    b.textContent = s;
    b.onclick = () => send(s);
    wrap.appendChild(b);
  });
  messagesEl.appendChild(wrap);
}
renderSuggestions();

function extractHtml(raw) {
  let cleaned = raw.trim();
  const m = cleaned.match(/```(?:html)?\s*([\s\S]*?)```/i);
  if (m) cleaned = m[1].trim();
  return cleaned;
}

function closeUnclosedTags(raw) {
  let out = raw;
  ['html', 'body', 'style', 'script'].forEach((tag) => {
    const openCount = (out.match(new RegExp('<' + tag + '[\\s>]', 'gi')) || []).length;
    const closeCount = (out.match(new RegExp('</' + tag + '>', 'gi')) || []).length;
    if (openCount > closeCount) out += '</' + tag + '>';
  });
  return out;
}

function currentHtml() {
  return historyIndex >= 0 ? history[historyIndex].html : '';
}

function renderPreview() {
  const h = currentHtml();
  if (h) {
    previewWrap.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.srcdoc = h;
    iframe.title = 'Vorschau';
    previewWrap.appendChild(iframe);
    previewTitle.textContent = history[historyIndex].title;
    downloadBtn.style.display = 'inline-block';
  } else {
    previewWrap.innerHTML = '<div id="empty-state"><p>Deine Vorschau erscheint hier</p></div>';
    previewTitle.textContent = 'neue-website.html';
    downloadBtn.style.display = 'none';
  }
  resetBtn.style.display = history.length > 0 ? 'inline-block' : 'none';
  versionBar.classList.toggle('show', history.length > 1);
  undoBtn.disabled = historyIndex <= 0;
  redoBtn.disabled = historyIndex >= history.length - 1;
  versionLabel.textContent = 'Version ' + (historyIndex + 1) + '/' + history.length;
}

undoBtn.onclick = () => { if (historyIndex > 0) { historyIndex--; renderPreview(); } };
redoBtn.onclick = () => { if (historyIndex < history.length - 1) { historyIndex++; renderPreview(); } };

resetBtn.onclick = () => {
  history = [];
  historyIndex = -1;
  messagesEl.innerHTML = '';
  addMessage('assistant', 'Neuer Start. Beschreib mir die nächste Website.');
  renderSuggestions();
  renderPreview();
  setMobileView('chat');
};

async function runGeneration(prompt) {
  loading = true;
  sendBtn.disabled = true;
  lastFailedPrompt = null;
  const loadingMsg = addMessage('loading', 'denke nach …');

  const html = currentHtml();
  const responsiveRule = 'Die Website MUSS responsive sein: <meta name="viewport" content="width=device-width, initial-scale=1"> im <head>, Layout mit flexiblen Einheiten/Flexbox/Grid, und Media Queries für Breakpoints unter ca. 640px.';
  const brevityRule = 'Das Antwortbudget ist knapp begrenzt. Arbeite effizient: kompaktes, aber vollständiges HTML, kein unnötiges Whitespace, CSS-Klassen statt wiederholter Inline-Styles.';
  const systemPrompt = html
    ? 'Du bist ein Website-Generator. Der Nutzer möchte die bestehende Website ändern. Aktueller HTML-Code:\n\n' + html + '\n\nGib AUSSCHLIESSLICH das komplette, aktualisierte HTML-Dokument zurück. Ändere nur, was verlangt wird. ' + responsiveRule + ' ' + brevityRule + ' Kein Markdown, kein Codeblock-Zaun.'
    : 'Du bist ein Website-Generator. Erzeuge ein komplettes, eigenständiges HTML-Dokument basierend auf der Beschreibung (inline CSS/JS). Durchdachte, passende Typografie und Farbpalette, keine Standard-Templates. ' + responsiveRule + ' ' + brevityRule + ' Gib AUSSCHLIESSLICH rohes HTML zurück, beginnend mit <!DOCTYPE html>.';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 4096,
        system: systemPrompt,
        messages: [{ role: 'user', content: prompt }],
        stream: true,
      }),
    });

    if (!response.ok || !response.body) throw new Error('Netzwerkfehler: ' + response.status);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';
    let stopReason = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice(6);
        if (jsonStr === '[DONE]') continue;
        try {
          const evt = JSON.parse(jsonStr);
          if (evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'text_delta') {
            fullText += evt.delta.text;
            loadingMsg.textContent = 'schreibe … ' + fullText.length + ' Zeichen';
          }
          if (evt.type === 'message_delta' && evt.delta && evt.delta.stop_reason) {
            stopReason = evt.delta.stop_reason;
          }
        } catch (e) {}
      }
    }

    let newHtml = extractHtml(fullText);
    const wasTruncated = stopReason === 'max_tokens';
    if (wasTruncated) newHtml = closeUnclosedTags(newHtml);

    loadingMsg.remove();

    if (newHtml && newHtml.toLowerCase().includes('<html')) {
      const titleMatch = newHtml.match(/<title>([\s\S]*?)<\/title>/i);
      const newTitle = titleMatch ? titleMatch[1].trim().toLowerCase().replace(/\s+/g, '-') + '.html' : 'website.html';
      history = history.slice(0, historyIndex + 1);
      history.push({ html: newHtml, title: newTitle, prompt });
      historyIndex++;
      addMessage('assistant', wasTruncated
        ? 'Fertig, allerdings war die Antwort an der Längengrenze – bitte gezielt nachfragen, falls etwas fehlt.'
        : 'Fertig – schau dir die Vorschau an. Sag mir, was ich ändern soll.');
      renderPreview();
      setMobileView('preview');
      const sugg = document.getElementById('suggestions-block');
      if (sugg) sugg.remove();
    } else {
      addMessage('assistant', 'Hmm, da ist etwas schiefgelaufen. Nochmal versuchen?');
      lastFailedPrompt = prompt;
    }
  } catch (err) {
    loadingMsg.remove();
    addMessage('assistant', 'Anfrage fehlgeschlagen (' + err.message + '). Key korrekt? Nochmal versuchen?');
    lastFailedPrompt = prompt;
  } finally {
    loading = false;
    sendBtn.disabled = !inputEl.value.trim();
  }
}

function send(overrideText) {
  const prompt = (overrideText !== undefined ? overrideText : inputEl.value).trim();
  if (!prompt || loading) return;
  if (!apiKey) { keyOverlay.style.display = 'flex'; return; }
  addMessage('user', prompt);
  inputEl.value = '';
  runGeneration(prompt);
}

sendBtn.onclick = () => send();
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
inputEl.addEventListener('input', () => { sendBtn.disabled = !inputEl.value.trim(); });
sendBtn.disabled = true;

addMessage('assistant', 'Beschreib mir die Website, die du haben willst. Ich baue sie live – du kannst danach beliebig weiter anpassen.');
renderPreview();
</script>
</body>
</html>
